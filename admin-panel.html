<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#355b46"><title>&#x8a18;&#x5e33;&#x5c0f;&#x5e6b;&#x624b; | &#x7ba1;&#x7406;&#x54e1;</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#20251f;font:16px system-ui,-apple-system,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.card{background:#fffefa;border:1px solid #e9e7de;border-radius:17px;padding:20px;margin:14px 0}.brand{color:#355b46;font-weight:800;font-size:21px}.top,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.btn{background:#355b46;color:white;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}.light{background:white;border:1px solid #e9e7de;color:#222}.login{max-width:420px;margin:8vh auto}.login h1{color:#355b46}.login label{display:block;font-size:13px;margin:14px 0 5px;color:#777}.login input{width:100%;padding:12px;border:1px solid #e9e7de;border-radius:10px;font:inherit}.login .btn{width:100%;margin-top:14px}.status,.hint{font-size:13px;color:#747b70;line-height:1.6}.hidden{display:none!important}.search{width:min(430px,100%);padding:10px;border:1px solid #e9e7de;border-radius:9px;font:inherit}.tablewrap{overflow:auto}table{width:100%;min-width:1120px;border-collapse:collapse}td,th{text-align:left;padding:8px 5px;border-bottom:1px solid #e9e7de;font-size:12px}th{color:#747b70;font-size:11px}td input,td select{width:100%;min-width:75px;padding:7px;border:1px solid #e9e7de;border-radius:7px;font:inherit}td.uid{max-width:170px;overflow-wrap:anywhere;font-size:10px}.row-actions{display:flex;gap:5px}.row-actions button{padding:7px 9px;font-size:12px}.danger{background:#a43d36}a{color:#355b46}</style></head><body><main class="wrap"><section id="login" class="card login"><div class="brand">&#x7ba1;&#x7406;&#x54e1;&#x767b;&#x5165;</div><p class="hint">&#x53ea;&#x6709;&#x6388;&#x6b0a;&#x7ba1;&#x7406;&#x54e1;&#x53ef;&#x958b;&#x555f;&#x5f8c;&#x53f0;&#x3002;</p><label for="email">&#x96fb;&#x5b50;&#x90f5;&#x4ef6;</label><input id="email" type="email" autocomplete="username" required><label for="password">&#x5bc6;&#x78bc;</label><input id="password" type="password" autocomplete="current-password" required><button class="btn" id="loginButton">&#x767b;&#x5165;&#x5f8c;&#x53f0;</button><p id="loginMessage" class="status" role="status"></p><a href="./">&#x56de;&#x5230;&#x8a18;&#x5e33;&#x9801;</a></section><section id="panel" class="hidden"><header class="top"><div><div class="brand">&#x5168;&#x90e8;&#x5e33;&#x672c;&#x7ba1;&#x7406;</div><p class="hint">&#x53ef;&#x67e5;&#x770b;&#x3001;&#x7de8;&#x8f2f;&#x53ca;&#x522a;&#x9664;&#x6240;&#x6709;&#x5e33;&#x865f;&#x7684;&#x8a18;&#x9304;&#x3002;&#x6b0a;&#x9650;&#x7531; Supabase &#x5f8c;&#x7aef;&#x5f37;&#x5236;&#x9a57;&#x8b49;&#x3002;</p></div><button class="btn light" id="logout">&#x767b;&#x51fa;</button></header><section class="card"><div class="actions"><input id="search" class="search" type="search" placeholder="&#x641c;&#x5c0b;&#x5e33;&#x865f; UID&#x3001;&#x5206;&#x985e;&#x3001;&#x5099;&#x8a3b;&#x6216;&#x65e5;&#x671f;"><span id="status" class="status"></span></div></section><section class="card tablewrap"><table><thead><tr><th>&#x5e33;&#x865f; UID</th><th>&#x65e5;&#x671f;</th><th>&#x985e;&#x578b;</th><th>&#x5206;&#x985e;</th><th>&#x91d1;&#x984d;</th><th>&#x4ed8;&#x6b3e;&#x65b9;&#x5f0f;</th><th>&#x5099;&#x8a3b;</th><th>&#x7167;&#x7247;</th><th>&#x64cd;&#x4f5c;</th></tr></thead><tbody id="rows"></tbody></table></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const $=s=>document.querySelector(s),db=supabase.createClient('https://vrbusthojffkbfqgkfnn.supabase.co','sb_publishable_2BV5qFfNB37IA5NFt6hwyQ_nk5PTEcN');let records=[];function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}function message(el,text){$(el).textContent=text}async function checkAdmin(){let s=await db.auth.getSession(),u=s.data.session?.user;if(!u){$('#login').classList.remove('hidden');$('#panel').classList.add('hidden');return false}let r=await db.rpc('is_ledger_admin');if(r.error||r.data!==true){await db.auth.signOut();$('#login').classList.remove('hidden');$('#panel').classList.add('hidden');message('#loginMessage','此帳號沒有管理員權限。');return false}$('#login').classList.add('hidden');$('#panel').classList.remove('hidden');await load();return true}async function load(){message('#status','\u8f09\u5165\u4e2d');let r=await db.from('ledger_entries').select('*').order('date',{ascending:false});if(r.error){message('#status','無法載入：'+r.error.message);return}records=r.data||[];render()}function render(){let q=$('#search').value.trim().toLowerCase(),list=records.filter(x=>[x.user_id,x.category,x.note,x.date,x.type].some(v=>String(v??'').toLowerCase().includes(q)));message('#status','共 '+records.length+' 筆記錄，顯示 '+list.length+' 筆');$('#rows').innerHTML=list.map(x=>`<tr data-id="${esc(x.id)}"><td class="uid">${esc(x.user_id)}</td><td><input type="date" data-f="date" value="${esc(x.date)}"></td><td><select data-f="type"><option value="expense" ${x.type==='expense'?'selected':''}>&#x652f;&#x51fa;</option><option value="income" ${x.type==='income'?'selected':''}>&#x6536;&#x5165;</option></select></td><td><input data-f="category" value="${esc(x.category)}"></td><td><input type="number" min="1" data-f="amount" value="${esc(x.amount)}"></td><td><input data-f="method" value="${esc(x.method)}"></td><td><input data-f="note" value="${esc(x.note)}"></td><td>${x.photo_path?`<a href="#" data-path="${esc(x.photo_path)}">&#x8f09;&#x5165;&#x4e2d;</a>`:''}</td><td><div class="row-actions"><button class="btn" data-save="${esc(x.id)}">&#x5132;&#x5b58;</button><button class="btn danger" data-delete="${esc(x.id)}">&#x522a;&#x9664;</button></div></td></tr>`).join('')||'<tr><td colspan="9">&#x6c92;&#x6709;&#x8a18;&#x9304;</td></tr>';document.querySelectorAll('#rows a[data-path]').forEach(async a=>{let r=await db.storage.from('ledger-photos').createSignedUrl(a.dataset.path,3600);if(r.data?.signedUrl){a.href=r.data.signedUrl;a.target='_blank';a.rel='noopener';a.textContent='\u67e5\u770b\u7167\u7247'}})}$('#loginButton').onclick=async()=>{message('#loginMessage','登入中');let r=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(r.error){message('#loginMessage',r.error.message);return}await checkAdmin()};$('#logout').onclick=async()=>{await db.auth.signOut();records=[];$('#panel').classList.add('hidden');$('#login').classList.remove('hidden');$('#password').value=''};$('#search').oninput=render;$('#rows').onclick=async e=>{let id=e.target.dataset.delete,save=e.target.dataset.save;if(id){if(!confirm('\u78ba\u5b9a\u6c38\u4e45\u522a\u9664\u9019\u7b46\u8a18\u9304\uff1f'))return;let old=records.find(x=>String(x.id)===String(id)),r=await db.from('ledger_entries').delete().eq('id',id);if(r.error){message('#status',r.error.message);return}if(old?.photo_path)await db.storage.from('ledger-photos').remove([old.photo_path]);records=records.filter(x=>String(x.id)!==String(id));render();return}if(save){let tr=e.target.closest('tr'),v=k=>tr.querySelector(`[data-f="${k}"]`).value,amount=Number(v('amount'));if(!v('date')||!v('category').trim()||!Number.isFinite(amount)||amount<=0){message('#status','請填好日期、分類及正確金額。');return}let patch={date:v('date'),type:v('type'),category:v('category').trim(),amount,method:v('method').trim(),note:v('note').trim()},r=await db.from('ledger_entries').update(patch).eq('id',save);if(r.error){message('#status',r.error.message);return}records=records.map(x=>String(x.id)===String(save)?{...x,...patch}:x);render();message('#status','記錄已更新')}};db.auth.getSession().then(checkAdmin);</script></body></html>
