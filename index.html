const $=s=>document.querySelector(s),now=new Date(),today=now.toISOString().slice(0,10),cats={expense:['\u9910\u98f2','\u4ea4\u901a','\u5c45\u5bb6','\u8cfc\u7269','\u5a1b\u6a02','\u91ab\u7642','\u5b78\u7fd2','\u5e33\u55ae','\u5176\u4ed6'],income:['\u85aa\u6c34','\u734e\u91d1','\u6295\u8cc7','\u9000\u6b3e','\u5176\u4ed6']};let rows=[],db=null,user=null,recovering=false;$('#month').value=today.slice(0,7);$('#date').value=today;function amount(n){return 'NT$ '+Number(n||0).toLocaleString('zh-TW')}function save(){if(user)localStorage.setItem('daily-ledger-v1:'+user.id,JSON.stringify(rows));render()}function showGate(){let ok=!!user&&!recovering;$('#loginScreen').classList.toggle('hidden',ok||recovering);$('#recoverScreen').classList.toggle('hidden',!recovering);$('#app').classList.toggle('hidden',!ok);$('#signout').classList.toggle('hidden',!ok)}function fill(){ $('#category').innerHTML=cats[$('#type').value].map(x=>`<option>${x}</option>`).join('')}$('#type').onchange=fill;fill();function render(){let m=$('#month').value,a=rows.filter(x=>x.date.startsWith(m)),i=a.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount),0),o=a.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount),0);$('#monthlabel').textContent=m+' \u6708\u6536\u652f';$('#balance').textContent=amount(i-o);$('#inc').textContent=amount(i);$('#exp').textContent=amount(o);$('#rows').innerHTML=a.sort((x,y)=>y.date.localeCompare(x.date)).map(x=>`<tr><td>${x.date}</td><td>${x.category}</td><td class="hide-mobile">${x.note||''}</td><td class="amount">${x.type==='expense'?'\u2212':'+'}${amount(x.amount)}</td><td><button class="del" data-id="${x.id}">&times;</button></td></tr>`).join('')||'<tr><td colspan="5">\u672c\u6708\u7121\u8a18\u9304</td></tr>'}$('#month').onchange=render;$('#form').onsubmit=async e=>{e.preventDefault();let x={id:crypto.randomUUID(),type:$('#type').value,amount:+$('#amount').value,category:$('#category').value,date:$('#date').value,method:$('#method').value,note:$('#note').value};rows.push(x);save();e.target.reset();$('#date').value=today;fill();if(db&&user){let r=await db.from('ledger_entries').insert({...x,user_id:user.id});$('#status').textContent=r.error?'\u540c\u6b65\u5931\u6557':'\u5df2\u540c\u6b65'}};$('#rows').onclick=async e=>{let id=e.target.dataset.id;if(!id)return;rows=rows.filter(x=>x.id!==id);save();if(db&&user)await db.from('ledger_entries').delete().eq('id',id).eq('user_id',user.id)};$('#export').onclick=()=>{let h=['\u65e5\u671f','\u985e\u578b','\u5206\u985e','\u91d1\u984d','\u4ed8\u6b3e\u65b9\u5f0f','\u5099\u8a3b'],q=v=>'"'+String(v??'').replaceAll('"','""')+'"',csv=[h,...rows.map(x=>[x.date,x.type,x.category,x.amount,x.method,x.note])].map(r=>r.map(q).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));a.download='daily-ledger.csv';a.click();URL.revokeObjectURL(a.href)};$('#saveconfig').onclick=()=>{localStorage.setItem('sburl',$('#url').value);localStorage.setItem('sbkey',$('#key').value);init()};async function init(){let u=localStorage.getItem('sburl')||'https://vrbusthojffkbfqgkfnn.supabase.co',k=localStorage.getItem('sbkey')||'sb_publishable_2BV5qFfNB37IA5NFt6hwyQ_nk5PTEcN';if(!window.supabase)return;$('#url').value=u;$('#key').value=k;$('#auth').classList.remove('hidden');db=window.supabase.createClient(u,k);let s=await db.auth.getSession();user=s.data.session?.user||null;showGate();db.auth.onAuthStateChange((event,session)=>{let next=session?.user||null;if(user?.id!==next?.id)rows=[];user=next;if(event==='PASSWORD_RECOVERY'){recovering=true;showGate();return}if(event==='SIGNED_IN')recovering=false;showGate();if(user)setTimeout(()=>sync(),0);else{rows=[];render()}});if(user)await sync()}async function sync(){if(!db||!user)return;rows=JSON.parse(localStorage.getItem('daily-ledger-v1:'+user.id)||'[]');let r=await db.from('ledger_entries').select('*').eq('user_id',user.id);if(r.error){$('#status').textContent='\u540c\u6b65\u5931\u6557';return}let cloud=r.data||[],known=new Set(cloud.map(x=>x.id)),local=rows.map(x=>({...x,id:String(x.id),user_id:user.id})),missing=local.filter(x=>!known.has(x.id));if(missing.length)await db.from('ledger_entries').upsert(missing);rows=[...cloud.map(({user_id,...x})=>x),...local.filter(x=>!known.has(x.id))];save();$('#status').textContent='\u96f2\u7aef\u5df2\u540c\u6b65'}async function authAction(action){let email=$('#loginEmail').value.trim(),password=$('#loginPassword').value;if(!db){$('#loginMessage').textContent='Authentication is not connected yet.';return}if(!$('#loginEmail').checkValidity()||!password){$('#loginMessage').textContent='Enter a valid email and password.';return}$('#loginMessage').textContent='Working...';let result;if(action==='signin')result=await db.auth.signInWithPassword({email,password});else result=await db.auth.signUp({email,password,options:{emailRedirectTo:location.href}});if(result.error){$('#loginMessage').textContent=result.error.message;return}$('#loginMessage').textContent=action==='signup'&&!result.data.session?'Account created. Check your email once to verify it.':'Signed in.'}$('#signInButton').onclick=()=>authAction('signin');$('#signUpButton').onclick=()=>authAction('signup');$('#forgotPassword').onclick=async()=>{let email=$('#loginEmail').value.trim();if(!db||!$('#loginEmail').checkValidity()){ $('#loginMessage').textContent='Enter the email address used for this account.';return}let r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.href});$('#loginMessage').textContent=r.error?r.error.message:'If this email is registered, a reset link has been sent.'};$('#updatePassword').onclick=async()=>{let password=$('#newPassword').value;if(password.length<8){$('#recoverMessage').textContent='Password must contain at least 8 characters.';return}let r=await db.auth.updateUser({password});$('#recoverMessage').textContent=r.error?r.error.message:'Password updated.';if(!r.error){recovering=false;showGate()}};$('#signout').onclick=async()=>{await db?.auth.signOut();user=null;rows=[];showGate();render()};$('#send').onclick=async()=>{};$('#logout').onclick=()=>db?.auth.signOut();render();showGate();init();;
</script></body></html>
