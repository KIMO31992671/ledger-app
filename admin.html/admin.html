<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#355b46"><title>管理員後台｜記帳小幫手</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#20251f;font:16px system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.card{background:#fffefa;border:1px solid #e9e7de;border-radius:16px;padding:20px;margin:14px 0}.brand{color:#355b46;font-weight:800;font-size:21px}button,input{font:inherit;border-radius:9px;padding:10px;border:1px solid #ddd}button{background:#355b46;color:white;border:0;cursor:pointer;margin:3px}.danger{background:#a43d36}label{display:block;margin:12px 0 4px}.login{max-width:420px;margin:8vh auto}.login input{width:100%}.hidden{display:none}#status{color:#747b70;font-size:14px}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}td,th{text-align:left;border-bottom:1px solid #eee;padding:8px;font-size:13px}.uid{max-width:170px;overflow-wrap:anywhere}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style><body><main class="wrap"><section id="login" class="card login"><div class="brand">管理員登入</div><p>僅限授權管理員查看和管理所有人的帳本。</p><label for="email">電子郵件</label><input id="email" type="email" autocomplete="username"><label for="password">密碼</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">登入後台</button><p id="loginMsg" role="status"></p><a href="./">回到記帳頁</a></section><section id="panel" class="hidden"><header class="tools"><div><div class="brand">全部帳本管理</div><p>檢視、編輯和刪除所有帳號的紀錄；權限由 Supabase 後端驗證。</p></div><button id="logout">登出</button></header><section class="card tools"><input id="search" placeholder="搜尋帳號 UID、分類、備註或日期"><span id="status"></span></section><section class="card table"><table><thead><tr><th>帳號 UID</th><th>日期</th><th>類型</th><th>分類</th><th>金額</th><th>付款方式</th><th>備註</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://vrbusthojffkbfqgkfnn.supabase.co','sb_publishable_2BV5qFfNB37IA5NFt6hwyQ_nk5PTEcN');let data=[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function enter(){let s=await db.auth.getSession(),u=s.data.session?.user;if(!u){$('#login').classList.remove('hidden');$('#panel').classList.add('hidden');return}let a=await db.rpc('is_ledger_admin');if(a.error||a.data!==true){$('#loginMsg').textContent='此帳號沒有管理員權限。';return}$('#login').classList.add('hidden');$('#panel').classList.remove('hidden');await load()}
async function load(){ $('#status').textContent='載入中…';let r=await db.from('ledger_entries').select('*').order('date',{ascending:false});if(r.error){$('#status').textContent='無法載入：'+r.error.message;return}data=r.data||[];render()}
function render(){let q=$('#search').value.toLowerCase(),list=data.filter(x=>[x.user_id,x.date,x.type,x.category,x.note].some(v=>String(v||'').toLowerCase().includes(q)));$('#status').textContent='共 '+data.length+' 筆，顯示 '+list.length+' 筆';$('#rows').innerHTML=list.map(x=>'<tr data-id="'+esc(x.id)+'"><td class="uid">'+esc(x.user_id)+'</td><td>'+esc(x.date)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.amount)+'</td><td>'+esc(x.method)+'</td><td>'+esc(x.note)+'</td><td><button data-edit="'+esc(x.id)+'">編輯</button><button class="danger" data-del="'+esc(x.id)+'">刪除</button></td></tr>').join('')||'<tr><td colspan="8">沒有記錄</td></tr>'}
$('#loginBtn').onclick=async()=>{ $('#loginMsg').textContent='登入中…';let r=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(r.error){$('#loginMsg').textContent=r.error.message;return}await enter()};$('#logout').onclick=async()=>{await db.auth.signOut();data=[];$('#panel').classList.add('hidden');$('#login').classList.remove('hidden');$('#password').value=''};$('#search').oninput=render;
$('#rows').onclick=async e=>{let id=e.target.dataset.del||e.target.dataset.edit;if(!id)return;let x=data.find(a=>String(a.id)===id);if(e.target.dataset.del){if(!confirm('確定刪除這筆記錄？'))return;let r=await db.from('ledger_entries').delete().eq('id',id);if(r.error)alert(r.error.message);else{data=data.filter(a=>String(a.id)!==id);render()}return}let v=k=>prompt('輸入'+k,x[k]??'');let date=v('日期'),type=v('類型（expense支出 / income收入）'),category=v('分類'),amount=v('金額'),method=v('付款方式'),note=v('備註');if([date,type,category,amount,method,note].some(a=>a===null))return;if(!date||!category||!Number.isFinite(Number(amount))||Number(amount)<=0){alert('日期、分類或金額格式不正確');return}let patch={date,type,category,amount:Number(amount),method,note},r=await db.from('ledger_entries').update(patch).eq('id',id);if(r.error)alert(r.error.message);else{data=data.map(a=>String(a.id)===id?{...a,...patch}:a);render()}};db.auth.getSession().then(enter);
</script></body></html>
